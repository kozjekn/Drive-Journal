# Production-like: full stack (API + MongoDB)
services:
  mongodb:
    image: mongo:7
    container_name: ridejournal-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  ridejournal:
    image: nejek16/ridejournal:latest
    container_name: ridejournal
    ports:
      - "8080:8080"          # http://localhost:8080 -> UI at / and API under /api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MongoDb__ConnectionString=mongodb://mongodb:27017
      - MongoDb__DatabaseName=ride_journal
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=RideJournal
      - Jwt__Audience=RideJournalApp
      - GoogleAuth__ClientId=${GOOGLE_CLIENT_ID}
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:
