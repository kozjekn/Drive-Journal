name: ride_journal
description: "Motorcycle ride tracker app for iOS and Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Local storage (Hive)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Maps (OpenStreetMap)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # GPS / Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Screen wake lock. The only lever available on web: a PWA cannot read GPS while
  # the page is hidden, so we keep the screen from turning off instead.
  # Held at <1.6.1: from 1.6.1 it needs win32 ^6, which conflicts with
  # flutter_secure_storage 9.x (win32 ^5). Only affects the Windows target, which we
  # don't ship. Bump both together if Windows ever matters.
  wakelock_plus: ^1.5.2

  # HTTP / API
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4

  # Network reachability, so a device that regains signal syncs immediately
  # instead of waiting for the next resume. Same win32 ^5 constraint as
  # flutter_secure_storage above, so the two resolve together.
  connectivity_plus: ^6.1.0

  # Auth
  google_sign_in: ^6.2.2

  # Image compression
  flutter_image_compress: ^2.3.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # DI code generation
  injectable_generator: ^2.6.2
  build_runner: ^2.4.14

  # Testing
  mockito: ^5.4.5

flutter:
  uses-material-design: true

  assets:
    # Light-on-dark variant of the brand lockup. The source logo_full.png is
    # drawn in near-black navy for light backgrounds; the app ships dark-only,
    # so the recoloured copy is what actually gets rendered.
    - assets/logo_full_light.png
